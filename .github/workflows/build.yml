name: Build DonutLeaderboard

# Manual build: GitHub repo > Actions tab > "Build DonutLeaderboard" > Run workflow.
# Then open the finished run and download the "DonutLeaderboard-jar" artifact.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build plugin jar (skips the heavy test suite)
        run: |
          chmod +x gradlew
          ./gradlew shadowJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DonutLeaderboard-jar
          path: build/libs/DonutLeaderboard-*.jar
